<svg xmlns="http://www.w3.org/2000/svg" width="360" height="100" viewBox="0 0 360 100" role="img" aria-labelledby="title">
  <title id="title">DriveCost</title>
  <style>
    svg { --accent: #1761bf; --warning: #c4263d; }
    .wordmark { fill: #111d30; }
    .arc {
      stroke-dasharray: 1;
      animation: draw 3s linear both;
    }
    .needle {
      transform-origin: 50px 57px;
      animation: sweep 3s linear both;
    }
    .gauge { animation: vibration 3s linear both; }
    .redline {
      opacity: 0;
      animation: warning 3s linear both;
    }
    .accent {
      fill: var(--accent);
      animation: cost-warning 3s linear both;
    }
    .cost-slide { animation: reveal-cost 3s both; }
    .ember {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: scatter 3s ease-out var(--delay, 0ms) both;
    }

    @keyframes draw {
      from { stroke-dashoffset: 1; }
      22%, 100% { stroke-dashoffset: 0; }
    }
    @keyframes sweep {
      0% { transform: rotate(-157deg); }
      4% {
        transform: rotate(-153deg);
        animation-timing-function: cubic-bezier(.18,.72,.25,1);
      }
      23% { transform: rotate(67deg); }
      28% { transform: rotate(55deg); }
      33% { transform: rotate(67deg); }
      38% { transform: rotate(49deg); }
      44% {
        transform: rotate(54deg);
        animation-timing-function: cubic-bezier(.2,.65,.3,1);
      }
      100% { transform: rotate(0deg); }
    }
    @keyframes vibration {
      0%, 21%, 47%, 100% { transform: translate(0, 0); }
      24%, 32%, 40% { transform: translate(-1.2px, .6px); }
      28%, 36%, 44% { transform: translate(1.2px, -.6px); }
    }
    @keyframes warning {
      0%, 8%, 100% { opacity: 0; }
      24%, 44% { opacity: 1; }
    }
    @keyframes cost-warning {
      0%, 8%, 100% { fill: var(--accent); }
      24%, 44% { fill: var(--warning); }
    }
    @keyframes reveal-cost {
      0%, 4% {
        transform: translateX(-88px);
        animation-timing-function: cubic-bezier(.22,.7,.3,1);
      }
      24%, 100% { transform: translateX(0); }
    }
    @keyframes scatter {
      0%, 18% {
        opacity: 0;
        transform: translate(0, 0) rotate(var(--tilt)) scale(.35);
      }
      22% { opacity: 1; }
      32% {
        opacity: .85;
        transform: translate(var(--x), var(--y)) rotate(var(--tilt)) scale(1);
      }
      47%, 100% {
        opacity: 0;
        transform: translate(var(--x), var(--fall)) rotate(var(--tilt)) scale(.2);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .arc, .needle, .gauge, .redline, .accent, .ember, .cost-slide {
        animation: none;
      }
    }
    @media (prefers-color-scheme: dark) {
      svg { --accent: #75b9ff; --warning: #ff6478; }
      .wordmark { fill: #f0f6ff; }
    }
  </style>

  <defs>
    <clipPath id="cost-reveal">
      <rect x="208" y="0" width="152" height="100"/>
    </clipPath>
  </defs>

  <g class="gauge">
    <rect x="8" y="8" width="84" height="84" rx="24" fill="#102b4b"/>
    <rect class="redline" x="8" y="8" width="84" height="84" rx="24"
          fill="#401a2a" stroke="#ff6478" stroke-width="2"/>

    <path d="M30 65a22 22 0 1 1 40 0" fill="none"
          stroke="#315784" stroke-width="5" stroke-linecap="round"/>
    <path class="arc" d="M30 65a22 22 0 1 1 40 0" pathLength="1"
          fill="none" stroke="#75b9ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M39 72h22" stroke="#75b9ff" stroke-width="3" stroke-linecap="round"/>

    <g class="redline" fill="none" stroke="#ff6478" stroke-linecap="round">
      <path d="M30 65a22 22 0 1 1 40 0" stroke-width="5"/>
      <path d="M39 72h22" stroke-width="3"/>
    </g>

    <path class="needle" d="M50 57l12-12" stroke="#f0f6ff"
          stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="57" r="4" fill="#f0f6ff"/>

    <g aria-hidden="true">
      <path class="ember" fill="#ff6a3d"
            style="--x: 8px; --y: -23px; --fall: -15px; --tilt: 20deg"
            d="M70 25c1 4 3 5 3 8a3 3 0 0 1-6 0c0-3 2-4 3-8z"/>
      <path class="ember" fill="#ffc15e"
            style="--x: 22px; --y: -20px; --fall: -10px; --tilt: 48deg; --delay: 75ms"
            d="M76 29c1 3 3 5 3 7a3 3 0 0 1-6 0c0-2 2-4 3-7z"/>
      <path class="ember" fill="#ff7547"
            style="--x: 23px; --y: -9px; --fall: 3px; --tilt: 72deg; --delay: 160ms"
            d="M78 38c1 3 2 4 2 6a2 2 0 0 1-4 0c0-2 1-3 2-6z"/>
      <path class="ember" fill="#ffdb80"
            style="--x: -7px; --y: -22px; --fall: -13px; --tilt: -24deg; --delay: 210ms"
            d="M61 26c1 3 2 4 2 6a2 2 0 0 1-4 0c0-2 1-3 2-6z"/>
    </g>
  </g>

  <g font-family="system-ui, Segoe UI, sans-serif" font-size="42"
     font-weight="750" letter-spacing="-1.8" aria-hidden="true">
    <text class="wordmark" x="110" y="65" textLength="98" lengthAdjust="spacing">Drive</text>
    <g clip-path="url(#cost-reveal)">
      <g class="cost-slide">
        <text class="accent" x="208" y="65" textLength="83" lengthAdjust="spacing">Cost</text>
      </g>
    </g>
  </g>
</svg>
