<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Obsidian -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0e" />
      <stop offset="50%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Electric Amber-Orange to Cyber Red-Pink: Solar Blaze -->
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a" />
      <stop offset="50%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#ff007a" />
    </linearGradient>

    <!-- Chrome Cyan & Headlight Glow -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Glow Behind Car-D -->
  <circle cx="256" cy="256" r="150" fill="#ff3b30" opacity="0.22" filter="blur(40px)" />

  <!-- "D" Shaped Modern Sports Car Silhouette -->
  <!-- The Left Vertical Pillar forms the front bumper & hood nose -->
  <!-- The Sweeping Right Arc forms the aerodynamic roofline, windshield, and rear spoiler, completing a pristine letter 'D' and sports car simultaneously -->
  <g id="car-monogram" filter="url(#glow)">
    <!-- Aerodynamic Roof & Hatch Arc (Completes the 'D' bow) -->
    <path 
      d="M 170 120 C 310 120 400 175 400 256 C 400 337 310 392 170 392" 
      fill="none" 
      stroke="url(#carGrad)" 
      stroke-width="48" 
      stroke-linecap="round" 
    />

    <!-- Front Nose / Vertical Left Pillar of 'D' (Car Cockpit & Grille Pillar) -->
    <path 
      d="M 152 140 C 152 126 162 118 174 118 L 186 118 C 198 118 206 126 206 140 L 206 372 C 206 386 198 394 186 394 L 174 394 C 162 394 152 386 152 372 Z" 
      fill="url(#carGrad)" 
    />

    <!-- Fastback Coupe Windshield & Cockpit Cutout inside the 'D' -->
    <path 
      d="M 216 190 C 275 190 320 220 320 256 C 320 292 275 322 216 322 Z" 
      fill="#0d0e14" 
      stroke="rgba(255,255,255,0.15)"
      stroke-width="6"
    />

    <!-- Speedline Headlight Slit (Cyan Laser LED) -->
    <path 
      d="M 334 232 C 362 242 376 256 376 256 C 376 256 362 270 334 280" 
      fill="none" 
      stroke="url(#cyanAccent)" 
      stroke-width="14" 
      stroke-linecap="round" 
    />

    <!-- Twin Alloy Wheels at the base line -->
    <circle cx="196" cy="392" r="28" fill="#14151e" stroke="url(#carGrad)" stroke-width="10" />
    <circle cx="196" cy="392" r="10" fill="url(#cyanAccent)" />

    <circle cx="340" cy="372" r="28" fill="#14151e" stroke="url(#carGrad)" stroke-width="10" />
    <circle cx="340" cy="372" r="10" fill="url(#cyanAccent)" />
  </g>
</svg>
