<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Titanium Obsidian -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Electric Cyan-Blue Neon Gradient for Drive Arc -->
    <linearGradient id="driveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Emerald Cost Glow for Precision Metric Notch -->
    <linearGradient id="costGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" stimulus="over" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" />

  <!-- Monogram Symbol: Modern Minimalist 'D' with Tachometer Velocity Curve & Currency Node -->
  <!-- Left Precision Pillar -->
  <path 
    d="M 160 130 C 160 120, 168 112, 178 112 L 198 112 C 208 112, 216 120, 216 130 L 216 382 C 216 392, 208 400, 198 400 L 178 400 C 168 400, 160 392, 160 382 Z" 
    fill="url(#driveGrad)" 
  />

  <!-- Dynamic Speed Arc / 'D' Bowl (Geometric Gauge Sweep) -->
  <path 
    d="M 216 112 L 275 112 C 360 112, 420 175, 420 256 C 420 337, 360 400, 275 400 L 216 400" 
    fill="none" 
    stroke="url(#driveGrad)" 
    stroke-width="56" 
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Speed Needle / Cost Vector Arc -->
  <path 
    d="M 216 200 L 265 200 C 298 200, 326 224, 326 256 C 326 288, 298 312, 265 312 L 216 312" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.15)" 
    stroke-width="20" 
    stroke-linecap="round"
  />

  <!-- Accent Pulse: Emerald Financial/Cost Efficiency Beacon -->
  <circle cx="360" cy="180" r="16" fill="url(#costGrad)" />
  <circle cx="360" cy="180" r="8" fill="#ffffff" />
</svg>