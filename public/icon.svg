<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Midnight Track Surface -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="50%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#040508" />
    </linearGradient>

    <!-- Automotive Solar Blaze Finish: Electric Amber, Supercar Crimson, Magenta Pearl -->
    <linearGradient id="supercarRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9500" />
      <stop offset="45%" stop-color="#ff3b30" />
      <stop offset="100%" stop-color="#d90429" />
    </linearGradient>

    <!-- Metallic Chrome Roofline & Trim -->
    <linearGradient id="chromeTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Smoked Privacy Glass -->
    <linearGradient id="cockpitGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Laser Cyan LED Headlight Beam -->
    <linearGradient id="laserCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Alloy Wheel Brake Caliper Glow -->
    <linearGradient id="wheelRims" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="carGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / Android Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="114" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Ambient Underbody Neon Glow -->
  <ellipse cx="270" cy="390" rx="170" ry="22" fill="#ff3b30" opacity="0.3" filter="blur(20px)" />

  <g id="realistic-supercar-d" filter="url(#carGlow)">
    <!-- Main Chassis: Sweeping Aerodynamic 'D' Silhouette -->
    <!-- The front splitter, sloping hood, fastback canopy and integrated rear ducktail form a proud letter 'D' -->
    <path 
      d="M 152 140 C 152 120 172 108 196 108 L 220 108 C 324 108 408 168 408 256 C 408 344 324 404 220 404 L 196 404 C 172 404 152 392 152 372 Z" 
      fill="url(#supercarRed)" 
    />

    <!-- Sculpted Side Air Scoop & Character Line -->
    <path 
      d="M 180 250 Q 240 248 310 230 Q 270 275 190 280 Z" 
      fill="#090a0f" 
      opacity="0.85" 
    />

    <!-- Aerodynamic Green-House / Windshield / Cabin (Inner D Counter) -->
    <path 
      d="M 210 160 C 278 160 338 200 338 256 C 338 290 310 320 270 334 C 230 334 210 334 210 334 Z" 
      fill="url(#cockpitGlass)" 
      stroke="url(#chromeTrim)" 
      stroke-width="5" 
    />

    <!-- A-Pillar and B-Pillar Structural Roof Trim -->
    <path 
      d="M 210 160 C 270 160 326 195 334 250" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="3" 
      opacity="0.75" 
    />

    <!-- Front Laser LED Matrix Headlight Slit (Aggressive DRL) -->
    <path 
      d="M 374 230 L 404 256 L 372 270 Z" 
      fill="url(#laserCyan)" 
    />
    <line x1="365" y1="256" x2="406" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Front Low-Profile Performance Alloy Wheel & Caliper -->
    <circle cx="340" cy="386" r="34" fill="url(#wheelRims)" stroke="#ff3b30" stroke-width="6" />
    <circle cx="340" cy="386" r="22" fill="#0b0f19" stroke="#94a3b8" stroke-width="2" />
    <circle cx="340" cy="386" r="10" fill="url(#laserCyan)" />
    <!-- Wheel Spokes -->
    <line x1="340" y1="358" x2="340" y2="414" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="312" y1="386" x2="368" y2="386" stroke="#94a3b8" stroke-width="2.5" />

    <!-- Rear Low-Profile Performance Alloy Wheel & Caliper -->
    <circle cx="188" cy="386" r="34" fill="url(#wheelRims)" stroke="#ff3b30" stroke-width="6" />
    <circle cx="188" cy="386" r="22" fill="#0b0f19" stroke="#94a3b8" stroke-width="2" />
    <circle cx="188" cy="386" r="10" fill="url(#laserCyan)" />
    <!-- Wheel Spokes -->
    <line x1="188" y1="358" x2="188" y2="414" stroke="#94a3b8" stroke-width="2.5" />
    <line x1="160" y1="386" x2="216" y2="386" stroke="#94a3b8" stroke-width="2.5" />
  </g>
</svg>
