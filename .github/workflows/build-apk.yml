name: Build Android APK

on:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'public/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Keystore
        run: |
          mkdir -p android-app
          keytool -genkeypair -v \
            -keystore android-app/android.keystore \
            -alias drivecost \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass drivecost123 \
            -keypass drivecost123 \
            -dname "CN=DriveCost, OU=Mobile, O=DriveCost India, L=Kolkata, ST=WB, C=IN"

      - name: Create twa-manifest.json and build APK
        working-directory: android-app
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "app.vercel.drivecost_nine.twa",
            "host": "drivecost-nine.vercel.app",
            "name": "DriveCost",
            "launcherName": "DriveCost",
            "display": "standalone",
            "themeColor": "#0071e3",
            "themeColorDark": "#06080d",
            "navigationColor": "#06080d",
            "navigationColorDark": "#06080d",
            "navigationDividerColor": "#000000",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#06080d",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://drivecost-nine.vercel.app/icon-512.png",
            "maskableIconUrl": "https://drivecost-nine.vercel.app/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "drivecost"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://drivecost-nine.vercel.app/",
            "minSdkVersion": 24,
            "orientation": "default"
          }
          EOF

          unset ANDROID_SDK_ROOT
          unset ANDROID_HOME
          export BUBBLEWRAP_KEYSTORE_PASSWORD=drivecost123
          export BUBBLEWRAP_KEY_PASSWORD=drivecost123
          yes | bubblewrap update --skipPwaValidation || true
          mkdir -p "$HOME/.bubblewrap/android_sdk/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" > "$HOME/.bubblewrap/android_sdk/licenses/android-sdk-license"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root="$HOME/.bubblewrap/android_sdk" --licenses >/dev/null 2>&1 || true
          bubblewrap build --skipPwaValidation

      - name: Rename and Publish DriveCost.apk to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: DriveCost Android APK
          body: Signed Android APK for DriveCost (`https://drivecost-nine.vercel.app`).
          files: android-app/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
